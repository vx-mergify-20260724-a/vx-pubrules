name: vx-lanef-pub-probe
on:
  workflow_dispatch:
    inputs:
      head: {required: false, default: 'vx-lanef-bystander'}

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HEAD: ${{ inputs.head }}
    steps:
      - name: probe
        run: |
          #!/usr/bin/env bash
          # Lane F bystander: is GITHUB_TOKEN (github-actions[bot]) exempt from
          # classic branch-protection restrictions.users on a PUBLIC repo?
          set +x
          API="https://api.github.com"
          SELF="${GITHUB_REPOSITORY:?}"
          HA="Authorization: Bearer $GH_TOKEN"
          HJ="Accept: application/vnd.github+json"
          probe() {
            local grp="$1" m="$2" path="$3" body="${4:-}"
            local hf="/tmp/vxh.$RANDOM" bf="/tmp/vxb.$RANDOM"
            local args=(-s -D "$hf" -o "$bf" -w '%{http_code}' -X "$m" -H "$HA" -H "$HJ" --max-time 25)
            [ -n "$body" ] && args+=(-H 'Content-Type: application/json' -d "$body")
            local code; code=$(curl "${args[@]}" "$API$path" 2>/dev/null)
            local acc; acc=$(grep -i '^x-accepted-github-permissions' "$hf" | tr -d '\r' | sed 's/^[^:]*: *//')
            local rid; rid=$(grep -i '^x-github-request-id' "$hf" | tr -d '\r' | sed 's/^[^:]*: *//')
            local snip; snip=$(tr '\n' ' ' < "$bf" | tr -s ' ' | head -c 500)
            printf 'VXPROBE|%s|%s %s|HTTP %s|want{%s}|rid{%s}|%s\n' "$grp" "$m" "$path" "$code" "$acc" "$rid" "$snip"
          }
          echo "=====VXLANEF-PUB META run=$GITHUB_RUN_ID repo=$SELF====="
          probe meta GET /installation/repositories
          MAINSHA=$(curl -s -H "$HA" -H "$HJ" "$API/repos/$SELF/git/ref/heads/main" | sed -n 's/.*"sha": *"\([^"]*\)".*/\1/p' | head -1)
          HEADSHA=$(curl -s -H "$HA" -H "$HJ" "$API/repos/$SELF/git/ref/heads/$HEAD" | sed -n 's/.*"sha": *"\([^"]*\)".*/\1/p' | head -1)
          echo "VXSHA|main=$MAINSHA|head=$HEADSHA"

          echo "=====CTL: ref-create on non-protected ref (positive control)====="
          probe ctl-refcreate POST /repos/$SELF/git/refs "{\"ref\":\"refs/heads/vx-lanef-tokref\",\"sha\":\"$MAINSHA\"}"

          echo "=====T1: PUT /contents benign file DIRECTLY on protected main====="
          B64=$(printf 'laneF pubrules direct-to-main via GITHUB_TOKEN\n' | base64 -w0)
          probe t1-contents-main PUT "/repos/$SELF/contents/vx-lanef-tokmain.txt" "{\"message\":\"vx-lanef pub t1\",\"content\":\"$B64\",\"branch\":\"main\"}"

          echo "=====T2: PATCH /git/refs/heads/main -> head sha (fast-forward)====="
          probe t2-refpatch PATCH /repos/$SELF/git/refs/heads/main "{\"sha\":\"$HEADSHA\",\"force\":false}"

          echo "=====T3: POST /merges base=main head=$HEAD====="
          probe t3-merges POST /repos/$SELF/merges "{\"base\":\"main\",\"head\":\"$HEAD\",\"commit_message\":\"vx-lanef pub: merge to restricted main\"}"

          echo "=====VERIFY====="
          probe verify-ref GET /repos/$SELF/git/ref/heads/main
          probe verify-file GET "/repos/$SELF/contents/vx-lanef-bystander.txt?ref=main"
